[project]
name = "lukestack-db-semantic-mcp"
version = "0.8.0"
description = "Semantic intelligence layer for SQL Server databases, exposed via MCP. A database understanding engine for AI agents (Claude Code CLI, Codex CLI, Claude Desktop, etc.)."
readme = "README.en.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Luke", email = "popo555155@gmail.com"},
]
keywords = [
    "mcp",
    "model-context-protocol",
    "sql-server",
    "mssql",
    "claude",
    "claude-code",
    "codex",
    "ai-agent",
    "semantic",
    "database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.27.0,<2.0.0",
    "pymssql>=2.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "keyring>=25.0.0",
    "tomlkit>=0.13.0",
    "sqlglot>=30.22.0,<30.23.0",
    "jsonschema>=4.20.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/LukeStackLab/sqlserver-semantic-mcp"
Repository = "https://github.com/LukeStackLab/sqlserver-semantic-mcp"
Issues = "https://github.com/LukeStackLab/sqlserver-semantic-mcp/issues"
Documentation = "https://github.com/LukeStackLab/sqlserver-semantic-mcp#readme"

[project.optional-dependencies]
oracle = ["oracledb>=3.4,<27"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.17.0",
]

[project.scripts]
db-semantic-mcp = "db_semantic_mcp.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["db_semantic_mcp*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Global Git ignore patterns must not hide tracked cache infrastructure.
respect-gitignore = false
extend-exclude = ["build", "source"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
ignore = [
    "E501",   # line wrapping is owned by `ruff format`; long strings stay as-is
    "UP042",  # str+Enum is intentional for JSON-serialisation compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["db_semantic_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires live SQL Server"
]
